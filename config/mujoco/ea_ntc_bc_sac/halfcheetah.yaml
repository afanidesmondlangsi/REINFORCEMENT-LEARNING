ac_gradient_clip: 100
alpha: 0.2
batch_size: 128
actor_lr: 0.0003
critic_lr: 0.0003
gamma: 0.99
max_epochs_since_update_decay_interval: 150000.0

state_dim: 17
action_dim: 3
hidden_sizes: 256
max_action: 1

temperature_opt: False

tau: 0.005
update_interval: 2
expl_noise: 0.2

eval_episode: 10
eval_freq: 10000
start_steps: 5000
max_step: 1000000
tar_env_interact_freq: 10

device: cuda

weight: 2.5

save_freq: 5000
# EA-NTC gate-only configuration
ea_gate_bc: true
ea_gate_critic: false
ea_adaptive_controller: false
ea_change_detector: false

ea_ensemble_size: 3
ea_hidden_size: 256
ea_gate_temperature: 1.0

ea_warmup_target_steps: 256
ea_dynamics_batch_size: 128
ea_dynamics_update_interval: 30
ea_calibration_update_interval: 30
ea_calibration_fraction: 0.20

# Phase 8: uncertainty-aware source gating
ea_gate_uncertainty: true
ea_uncertainty_temperature: 1.0
ea_uncertainty_min_reference: 0.000001

# Phase 9: Calibration reliability
ea_calibration_gap: 8

# Dynamics model reliability safeguards
ea_min_dynamics_updates: 20
ea_max_calibration_error: 0.05
